# ============================================================
#  DaftraAI-Simulator — Docker Compose (Local Testing)
#
#  Usage:
#    cp .env.example .env
#    # Edit .env with your real API keys + JWT_SECRET
#    docker compose up -d --build
#    docker compose logs -f
#
#  Stop:
#    docker compose down
#
#  Data persists in Docker volumes across restarts.
# ============================================================
services:
  app:
    build: .
    restart: always
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - app_data:/app/data
      - recordings:/recordings
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:8000/health'); r.raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  app_data:
  recordings:
